<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyMonitor - Controle</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f0f23;
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        h1 { text-align: center; margin-bottom: 10px; color: #fff; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        button {
            padding: 14px 28px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:hover { transform: scale(1.03); }
        button:active { transform: scale(0.98); }
        .btn-start { background: #22c55e; color: #fff; }
        .btn-stop { background: #ef4444; color: #fff; }
        .btn-refresh { background: #3b82f6; color: #fff; }
        #status {
            text-align: center;
            font-size: 20px;
            margin-bottom: 20px;
            padding: 12px;
            border-radius: 8px;
            background: #1a1a2e;
            border: 1px solid #333;
        }
        #status.active { color: #22c55e; border-color: #22c55e; }
        #status.inactive { color: #ef4444; border-color: #ef4444; }
        #gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 15px;
        }
        .img-card {
            background: #1a1a2e;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            transition: transform 0.2s;
        }
        .img-card:hover { transform: translateY(-4px); border-color: #555; }
        .img-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
        }
        .img-card .info {
            padding: 10px;
            font-size: 12px;
            color: #888;
            text-align: center;
        }
        .empty {
            text-align: center;
            color: #555;
            padding: 60px 20px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <h1>BabyMonitor</h1>
    <p class="subtitle">Surveillance a distance de l'ecran du telephone</p>

    <div class="controls">
        <button class="btn-start" onclick="setCapture(true)">Demarrer la capture</button>
        <button class="btn-stop" onclick="setCapture(false)">Arreter</button>
        <button class="btn-refresh" onclick="refreshImages()">Rafraichir</button>
    </div>

    <div id="status" class="inactive">Statut : EN ATTENTE</div>

    <div id="gallery">
        <div class="empty">Aucune image recue. Demarrez la capture sur le telephone.</div>
    </div>

    <script>
        const API = window.location.origin + "/api";

        async function setCapture(active) {
            try {
                const res = await fetch(`${API}/command?active=${active}`, { method: 'POST' });
                const data = await res.json();
                updateStatus(data.capture);
            } catch (e) {
                alert("Erreur serveur : " + e.message);
            }
        }

        function updateStatus(active) {
            const el = document.getElementById('status');
            if (active) {
                el.textContent = "Statut : CAPTURE ACTIVE - Le telephone envoie des images";
                el.className = "active";
            } else {
                el.textContent = "Statut : EN ATTENTE - Aucune capture en cours";
                el.className = "inactive";
            }
        }

        async function refreshImages() {
            try {
                const res = await fetch(`${API}/images`);
                const files = await res.json();
                const gallery = document.getElementById('gallery');

                if (files.length === 0) {
                    gallery.innerHTML = '<div class="empty">Aucune image recue. Demarrez la capture sur le telephone.</div>';
                    return;
                }

                gallery.innerHTML = files.map(f => {
                    const date = new Date(parseInt(f.match(/\d+/)?.[0] || 0));
                    const timeStr = date.toLocaleTimeString('fr-FR');
                    return `
                        <div class="img-card">
                            <img src="${API}/image/${f}" alt="capture" loading="lazy">
                            <div class="info">Capture a ${timeStr}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error(e);
            }
        }

        setInterval(refreshImages, 8000);
        checkStatus();
        refreshImages();

        async function checkStatus() {
            try {
                const res = await fetch(`${API}/command`);
                const data = await res.json();
                updateStatus(data.capture);
            } catch (e) {}
        }
    </script>
</body>
</html>
